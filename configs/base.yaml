# Base configuration shared across all experiments
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  train_split: "data/splits/train.txt"
  val_split: "data/splits/val.txt"
  image_size: [512, 512]
  num_bands: 16
  wavelength_range: [460.0, 600.0]
  per_band_norm: true
  num_workers: 4

training:
  epochs: 80
  batch_size: 8
  gradient_accumulation_steps: 1
  mixed_precision: true
  save_dir: "checkpoints/default"
  log_interval: 10
  eval_interval: 1
  patience: 15

optimizer:
  type: "AdamW"
  learning_rate: 0.0005
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  type: "cosine"
  warmup_epochs: 4
  min_lr: 1.0e-6

loss:
  cls_weight: 1.0
  box_weight: 7.5
  objectness_weight: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.5
  spectral_noise: true
  spectral_noise_std: 0.02
  band_dropout: true
  band_dropout_prob: 0.1
  spectral_intensity_scale: 0.05

evaluation:
  conf_threshold: 0.05
  nms_iou_threshold: 0.50
  max_detections: 100
