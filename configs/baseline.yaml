# Model A: RGB 3-Band Baseline Detector
experiment_name: "exp01_rgb_baseline"

model:
  name: "hyperspectral_detector"
  mode: "rgb_baseline"
  input_channels: 3
  # Select bands approximating R (~600nm), G (~530nm), B (~470nm) from 16 bands
  selected_bands: [2, 7, 15]
  num_classes: 18
  backbone: "spatial"
  spatial_depth: "resnet18"
  neck: "fpn"
  neck_channels: 128
  head_channels: 128
  num_anchors: 3

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  train_split: "data/splits/train.txt"
  val_split: "data/splits/val.txt"
  image_size: [512, 512]
  num_bands: 16
  wavelength_range: [460.0, 600.0]
  per_band_norm: true
  num_workers: 4

training:
  epochs: 50
  batch_size: 8
  gradient_accumulation_steps: 1
  mixed_precision: true
  save_dir: "checkpoints/exp01_rgb_baseline"
  log_interval: 10
  eval_interval: 1

optimizer:
  type: "AdamW"
  learning_rate: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  type: "cosine"
  warmup_epochs: 3
  min_lr: 1.0e-6

loss:
  cls_weight: 1.0
  box_weight: 7.5
  objectness_weight: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  iou_type: "ciou"

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation_degrees: 10.0
  random_crop: 0.2
  spectral_noise: false
  band_dropout: false

evaluation:
  conf_threshold: 0.05
  nms_iou_threshold: 0.50
  max_detections: 100
